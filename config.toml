baseURL = "https://jefflinse.io"
title = "Jeff Linse"

theme = "hugo-coder"

defaultContentLanguage = "en"

enableEmoji = true

googleAnalytics = "G-X3LFE83NPE"

[pagination]
    pagerSize = 20

[params]
    author = "Jeff Linse"
    #description = ""
    keywords = "jeff,linse,jefflinse,jlinse,software,developer,engineer,seattle,wa,washington,hbo,warner,media,warnermedia"
    info = "Backend & Platform Engineer"
    avatarURL = "images/avatar.jpg"
    #gravatar = "name@example.com"
    #footerContent = "Enter a text here."

    dateFormat = "January 2, 2006"

    hideFooter = true
    hideCredits = false
    hideCopyright = false
    since = 2020

    rtl = false

    # Specify light/dark colorscheme
    # Supported values:
    # "auto" (use preference set by browser)
    # "dark" (dark background, light foreground)
    # "light" (light background, dark foreground) (default)
    colorScheme = "light"

    # Hide the toggle button, along with the associated vertical divider
    hideColorSchemeToggle = true

    # Series see also post count
    maxSeeAlsoItems = 5

    # Custom SCSS
    customSCSS = ["scss/overrides.scss"]

[taxonomies]
    category = "categories"
    series = "series"
    tag = "tags"
    author = "authors"

[markup]
    [markup.highlight]
        # Use theme-provided CSS classes (supports light/dark) instead of inline styles
        noClasses = false
        codeFences = true
        guessSyntax = true
        tabWidth = 4
    [markup.goldmark.renderer]
        # Allow raw HTML in markdown content
        unsafe = true

[[params.social]]
    name = "Github"
    icon = "fa-brands fa-github fa-2x"
    weight = 1
    url = "https://github.com/jefflinse"
[[params.social]]
    name = "LinkedIn"
    icon = "fa-brands fa-linkedin fa-2x"
    weight = 4
    url = "https://www.linkedin.com/in/jefflinse"
#[[params.social]]
#    name = "RSS"
#    icon = "fa-solid fa-rss fa-2x"
#    weight = 6
#    url = "/index.xml"
#    rel = "alternate"
#    type = "application/rss+xml"

[languages]
    [languages.en]
        label = "English"
        locale = "en"

        [languages.en.menu]
            [[languages.en.menu.main]]
                name = "Blog"
                weight = 1
                url = "posts/"

            [[languages.en.menu.main]]
                name = "Projects"
                weight = 2
                url = "projects/"
